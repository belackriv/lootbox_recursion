player_actions:
  - name: "scavenge"
    label: "Scavenge"
    tooltip: "Search the area for raw materials. Takes time but yields wood and iron."
    disabled: false
    revealed: true
    cooldown: 5
    on_cooldown_until: null
    cast_time: 5
    choices: []
    requirements: []
    reveal_requirements: []

  - name: "craft"
    label: "Craft"
    tooltip: "Craft items from your gathered materials. Requires 50+ wood and 50+ iron."
    disabled: true
    revealed: true
    cooldown: 5
    on_cooldown_until: null
    cast_time: 5
    choices: []
    requirements:
      - check: "inventory_items"
        for_item_type: "WoodInventoryItem"
        condition: "gt"
        value: 50
      - check: "inventory_items"
        for_item_type: "IronInventoryItem"
        condition: "gt"
        value: 50
    reveal_requirements: []

